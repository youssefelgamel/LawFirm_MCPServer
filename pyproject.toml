[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawfirm-mcp-server"
version = "0.1.0"
description = "An MCP server for intelligent legal case intake and assignment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pydantic",
]
optional-dependencies = { cli = [] }

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]
